<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Announcement</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Edit Announcement</span>
        <a th:href="@{/}" class="btn btn-light btn-sm">Back</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header">
                    <h4 class="mb-0">Update Announcement</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/save}" th:object="${announcement}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" th:field="*{title}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Content</label>
                            <textarea th:field="*{content}" class="form-control" rows="6" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Save Announcement</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
