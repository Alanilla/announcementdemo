<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Announcement Demo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Announcement Demo</span>
        <a th:href="@{/edit}" class="btn btn-warning btn-sm">Edit Announcement</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header">
            <h3 class="mb-0">Current Announcement</h3>
        </div>
        <div class="card-body">
            <h4 th:text="${announcement.title}">Title</h4>
            <p class="mt-3" th:text="${announcement.content}">Content</p>

            <p class="text-muted mt-4 mb-1">
                <strong>Updated At:</strong>
                <span th:text="${announcement.updatedAt}">Timestamp</span>
            </p>

            <p class="text-secondary" th:text="${pageNote}"></p>
        </div>
    </div>
</div>

</body>
</html>
